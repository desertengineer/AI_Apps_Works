name: De-Ad & Strip Tracking from APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Type the exact filename of the target APK inside APKs-Org/'
        required: true
        type: string

permissions:
  contents: write

jobs:
  strip-ads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Tools
        run: |
          set -euo pipefail
          mkdir -p bin
          # Download official release binaries directly from their source repositories
          curl -L -o bin/apktool.jar https://github.com
          curl -L -o bin/uber-apk-signer.jar https://github.com
          chmod +x bin/*.jar
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Validate Source File
        run: |
          set -euo pipefail
          if [ ! -d "APKs-Org" ]; then
            echo "::error::APKs-Org folder not found"
            exit 1
          fi
          
          echo "=== Available files in APKs-Org/ ==="
          ls -la APKs-Org/
          echo "===================================="

          RAW_INPUT="${{ inputs.apk_name }}"
          CLEAN_INPUT=$(echo "$RAW_INPUT" | xargs)
          
          if [[ "$CLEAN_INPUT" != *.apk && "$CLEAN_INPUT" != *.APK ]]; then
            CLEAN_INPUT="${CLEAN_INPUT}.apk"
          fi

          MATCHING_FILE=$(find APKs-Org/ -maxdepth 1 -iname "$CLEAN_INPUT" | head -n 1)

          if [ -z "$MATCHING_FILE" ]; then
            echo "::error::File not found: $CLEAN_INPUT"
            exit 1
          fi

          echo "Verified file path found: $MATCHING_FILE"
          echo "VERIFIED_APK_PATH=$MATCHING_FILE" >> $GITHUB_ENV
          echo "VERIFIED_APK_NAME=$(basename "$MATCHING_FILE")" >> $GITHUB_ENV

      - name: Decompile APK
        run: |
          java -jar bin/apktool.jar d "$VERIFIED_APK_PATH" -o decompiled_apk --force-manifest

      - name: Remove Ad/Tracking Permissions
        run: |
          MANIFEST="decompiled_apk/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Processing AndroidManifest.xml..."
            
            # 1. Strip all explicit network and hardware identification access tokens
            sed -i '/android.permission.INTERNET/d' "$MANIFEST"
            sed -i '/android.permission.ACCESS_NETWORK_STATE/d' "$MANIFEST"
            sed -i '/android.permission.ACCESS_WIFI_STATE/d' "$MANIFEST"
            sed -i '/com.google.android.gms.permission.AD_ID/d' "$MANIFEST"
            sed -i '/com.android.vending.BILLING/d' "$MANIFEST"
            sed -i '/<activity[^>]*com\.wortise\.ads/d' "$MANIFEST"
            sed -i '/<activity[^>]*com\.applovin/d' "$MANIFEST"
            sed -i '/<activity[^>]*com\.google\.android\.gms\.ads/d' "$MANIFEST"
            sed -i '/<provider[^>]*com\.google\.android\.gms\.ads/d' "$MANIFEST"
            sed -i '/<provider[^>]*com\.adjust/d' "$MANIFEST"
            
            echo "Manifest cleanup validation:"
            grep -E "permission|ads|applovin|wortise" "$MANIFEST" || echo "Cleaned completely!"
          fi

      - name: Remove Known SDK Paths
        run: |
          cd decompiled_apk
          
          # Exhaustive matrix covering requested network definitions across standard and multidex structures
          TARGET_SMALI_PATHS=(
            "smali*/com/wortise/ads"
            "smali*/com/applovin"
            "smali*/com/google/android/gms/ads"
            "smali*/com/google/firebase/analytics"
            "smali*/com/amazon/device/ads"
            "smali*/com/amazon/aps"
            "smali*/com/startapp"
            "smali*/com/ironsource"
            "smali*/com/facebook/ads"
            "smali*/com/unity3d/services/ads"
            "smali*/com/mbridge/msdk"
            "smali*/com/chartboost/sdk"
            "smali*/com/appnext"
            "smali*/com/fyber/inneractive"
            "smali*/com/adjust/sdk"
            "smali*/com/digitalturbine/ignite"
            "smali*/com/amazon/device/iap"
          )
          
          echo "Executing codebase purge..."
          for pattern in "${TARGET_SMALI_PATHS[@]}"; do
            for directory in $pattern; do
              if [ -d "$directory" ]; then
                echo "Stripping bytecode signature block: $directory"
                rm -rf "$directory"
              fi
            done
          done

      - name: Rebuild APK
        run: |
          mkdir -p unsigned_output
          java -jar bin/apktool.jar b decompiled_apk -o "unsigned_output/$VERIFIED_APK_NAME"

      - name: Sign APK
        run: |
          mkdir -p APKs-AdsFree
          java -jar bin/uber-apk-signer.jar \
            --apks unsigned_output/ \
            --out APKs-AdsFree/ \
            --overwrite
          SIGNED_APK=$(find APKs-AdsFree -maxdepth 1 -type f -name '*.apk' -print -quit)
          if [ -z "$SIGNED_APK" ]; then
            echo "::error::Signer did not produce an APK."
            exit 1
          fi
          if [ "$SIGNED_APK" != "APKs-AdsFree/$VERIFIED_APK_NAME" ]; then
            mv "$SIGNED_APK" "APKs-AdsFree/$VERIFIED_APK_NAME"
          fi

      - name: Commit Artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "APKs-AdsFree/$VERIFIED_APK_NAME"
          git commit -m "Automated Strip: $VERIFIED_APK_NAME" || echo "No changes"
          git push origin main
