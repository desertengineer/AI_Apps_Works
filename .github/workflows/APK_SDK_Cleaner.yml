name: De-Ad & Strip Tracking from APK

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'Type the exact filename of the target APK inside APKs-Org/ (e.g., app-release.apk)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  strip-ads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bin

          echo "Downloading Apktool..."
          curl --fail --location --retry 3 --silent --show-error \
            -o bin/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

          echo "Downloading Uber APK Signer..."
          curl --fail --location --retry 3 --silent --show-error \
            -o bin/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          echo "Validating JAR files..."
          jar tf bin/apktool.jar >/dev/null
          jar tf bin/uber-apk-signer.jar >/dev/null

          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Validate Source File
        shell: bash
        env:
          APK_NAME_INPUT: ${{ inputs.apk_name }}
        run: |
          set -euo pipefail

          if [ ! -d "APKs-Org" ]; then
            echo "::error::The directory 'APKs-Org/' does not exist in the root of your repository."
            exit 1
          fi

          echo "=== Available files in APKs-Org/ ==="
          ls -la APKs-Org/
          echo "===================================="

          CLEAN_INPUT="$(printf '%s' "$APK_NAME_INPUT" | xargs)"

          if [[ "$CLEAN_INPUT" != *.apk && "$CLEAN_INPUT" != *.APK ]]; then
            CLEAN_INPUT="${CLEAN_INPUT}.apk"
          fi

          MATCHING_FILE="$(find APKs-Org/ -maxdepth 1 -type f -iname "$CLEAN_INPUT" | head -n 1)"

          if [ -z "$MATCHING_FILE" ]; then
            echo "::error::Could not find a file matching '$CLEAN_INPUT' (case-insensitive) in APKs-Org/."
            echo "Please verify the filename from the list above."
            exit 1
          fi

          echo "Verified file path found: $MATCHING_FILE"
          echo "VERIFIED_APK_PATH=$MATCHING_FILE" >> "$GITHUB_ENV"
          echo "VERIFIED_APK_NAME=$(basename "$MATCHING_FILE")" >> "$GITHUB_ENV"

      - name: Decompile APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar bin/apktool.jar d "$VERIFIED_APK_PATH" -o decompiled_apk --force-manifest

      - name: Remove Ad/Tracking Permissions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re

          manifest_path = "decompiled_apk/AndroidManifest.xml"
          
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Strip the core network and tracking permissions completely
          permissions_to_remove = [
              r'<uses-permission[^>]*android:name="android\.permission\.INTERNET"[^>]*/>',
              r'<uses-permission[^>]*android:name="android\.permission\.ACCESS_NETWORK_STATE"[^>]*/>',
              r'<uses-permission[^>]*android:name="android\.permission\.ACCESS_WIFI_STATE"[^>]*/>',
              r'<uses-permission[^>]*android:name="com\.google\.android\.gms\.permission\.AD_ID"[^>]*/>',
              r'<uses-permission[^>]*android:name="com\.android\.vending\.BILLING"[^>]*/>'
          ]
          
          for pattern in permissions_to_remove:
              content = re.sub(pattern, "", content)

          # 2. Block all 13 compiled ad activities and service declarations
          sdk_fragments = [
              "wortise", "applovin", "google.android.gms.ads", "facebook.ads",
              "ironsource", "unity3d", "startapp", "mbridge", "chartboost",
              "adjust", "appnext", "fyber", "digitalturbine"
          ]

          # Loop through each component type separately to avoid backreference errors
          component_types = ["activity", "activity-alias", "service", "receiver", "provider"]

          for fragment in sdk_fragments:
              for comp_type in component_types:
                  # Match explicit open/close tags: <activity ...> ... </activity>
                  full_pattern = rf'<{comp_type}[^>]*name="[^"]*{fragment}[^"]*"[^>]*>.*?</{comp_type}>'
                  content = re.sub(full_pattern, "", content, flags=re.DOTALL | re.IGNORECASE)
                  
                  # Match self-closing tag formats: <activity ... />
                  self_closing_pattern = rf'<{comp_type}[^>]*name="[^"]*{fragment}[^"]*"[^>]*/>'
                  content = re.sub(self_closing_pattern, "", content, flags=re.IGNORECASE)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Manifest cleanup complete without errors.")
          PY



      - name: Remove Known SDK Paths
        shell: bash
        run: |
          set -euo pipefail

          cd decompiled_apk

          TARGET_SMALI_PATHS=(
            "smali*/com/wortise/ads"
            "smali*/com/applovin"
            "smali*/com/google/android/gms/ads"
            "smali*/com/google/firebase/analytics"
            "smali*/com/amazon/device/ads"
            "smali*/com/amazon/aps"
            "smali*/com/startapp"
            "smali*/com/ironsource"
            "smali*/com/facebook/ads"
            "smali*/com/unity3d/services/ads"
            "smali*/com/mbridge/msdk"
            "smali*/com/chartboost/sdk"
            "smali*/com/appnext"
            "smali*/com/fyber/inneractive"
            "smali*/com/adjust/sdk"
            "smali*/com/digitalturbine/ignite"
            "smali*/com/amazon/device/iap"
          )

          echo "Executing codebase purge..."
          for pattern in "${TARGET_SMALI_PATHS[@]}"; do
            for directory in $pattern; do
              if [ -d "$directory" ]; then
                echo "Removing SDK directory: $directory"
                rm -rf -- "$directory"
              fi
            done
          done

      - name: Rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned_output
          java -jar bin/apktool.jar b decompiled_apk -o "unsigned_output/$VERIFIED_APK_NAME"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          SIGNER_OUTPUT="signed_output"
          mkdir -p APKs-AdsFree
          rm -rf "$SIGNER_OUTPUT"
          mkdir -p "$SIGNER_OUTPUT"

          java -jar bin/uber-apk-signer.jar \
            --apks unsigned_output/ \
            --out "$SIGNER_OUTPUT"

          SIGNED_APK="$(find "$SIGNER_OUTPUT" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$SIGNED_APK" ]; then
            echo "::error::Uber APK Signer did not produce an APK."
            exit 1
          fi

          mv -- "$SIGNED_APK" "APKs-AdsFree/$VERIFIED_APK_NAME"
          ls -l APKs-AdsFree

      - name: Commit Clean APK
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "APKs-AdsFree/$VERIFIED_APK_NAME"

          if git diff --cached --quiet; then
            echo "No APK changes to commit."
            exit 0
          fi

          git commit -m "Automated Strip: Removed ad/tracking code from $VERIFIED_APK_NAME"
          git push origin HEAD:${GITHUB_REF_NAME}